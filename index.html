<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Solo se cargan ficheros de este mismo sitio (y la API de GitHub para el boton Actualizar): nada externo, nada inline -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.github.com; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
<title>Stock OttO</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="header">
    <h1 class="title">Stock OttO</h1>
    <p class="subtitle">Seguimiento no oficial del stock publicado en otto-models.com</p>
  </header>

  <form class="login" id="login" autocomplete="on">
    <div class="sheet">
      <div class="sheet-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M8 10V7.5a4 4 0 1 1 8 0V10h.5A2.5 2.5 0 0 1 19 12.5v6a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18.5v-6A2.5 2.5 0 0 1 7.5 10H8Zm1.75 0h4.5V7.5a2.25 2.25 0 0 0-4.5 0V10Z"/></svg>
      </div>
      <h2 class="sheet-title">Contenido protegido</h2>
      <p class="sheet-text">Introduce la contraseña para ver el stock.</p>
      <label class="sr-only" for="clave">Contraseña</label>
      <input class="field" id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <label class="check"><input id="recordar" type="checkbox"><span>Recordar en este dispositivo</span></label>
      <button class="btn btn-primary" type="submit" id="entrar">Entrar</button>
      <p class="error" id="error" role="alert"></p>
    </div>
  </form>

  <main id="app" hidden>
    <div class="controls">
      <div class="segmented" id="tabs" role="tablist" aria-label="Sección" data-sel="Club">
        <span class="segmented-thumb" aria-hidden="true"></span>
        <button class="tab" type="button" role="tab" data-sec="Club" aria-selected="true">Club<span class="n" id="n-Club"></span></button>
        <button class="tab" type="button" role="tab" data-sec="Tienda" aria-selected="false">Tienda<span class="n" id="n-Tienda"></span></button>
        <button class="tab" type="button" role="tab" data-sec="BlackFriday" aria-selected="false">Black Friday<span class="n" id="n-BlackFriday"></span></button>
      </div>
      <button type="button" class="btn btn-toolbar" id="actualizar" aria-label="Actualizar el Club" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13.25 2v3.25H10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Actualizar</span>
      </button>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.25 10.25 3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="sr-only">Buscar</span>
        <input id="q" type="search" placeholder="Buscar modelo o referencia" autocomplete="off" spellcheck="false">
      </label>
    </div>

    <div class="summary" id="chips"></div>

    <div class="list" id="lista">
      <table>
        <thead><tr id="cabecera"></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>

    <footer class="statusbar">
      <span id="estado"></span>
      <span class="siguiente" id="siguiente"></span>
      <span class="progreso" id="progreso" role="status" aria-live="polite" hidden>
        <span class="barra" aria-hidden="true"><span id="progreso-barra"></span></span>
        <span id="progreso-texto"></span>
      </span>
      <button type="button" class="link-btn" id="salir">Salir</button>
    </footer>
  </main>

  <dialog class="dialogo" id="dlg-pin" aria-labelledby="dlg-titulo">
    <form class="dialogo-cuerpo" id="form-pin" autocomplete="off">
      <h2 class="sheet-title" id="dlg-titulo">Actualizar el Club</h2>
      <p class="sheet-text" id="dlg-texto">Introduce el PIN para consultar ahora el stock del Club.</p>
      <label class="sr-only" for="pin">PIN</label>
      <input class="field field-pin" id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" required>
      <p class="error" id="error-pin" role="alert"></p>
      <div class="dialogo-botones">
        <button type="button" class="btn btn-secondary" id="pin-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="pin-ok">Actualizar</button>
      </div>
    </form>
  </dialog>
</div>
<script src="app.js"></script>
</body>
</html>
